name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.4). Leave empty to use current ref.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          INPUT_TAG="${{ inputs.tag }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            # workflow_dispatch without input falls back to current SHA tag handling
            if [[ "$TAG" == "$GITHUB_REF" ]]; then
              TAG="$(git describe --tags --exact-match 2>/dev/null || echo "v0.0.0-manual")"
            fi
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"
          cat "$GITHUB_OUTPUT"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Verify formatting / lint (non-blocking)
        run: cargo clippy --locked -- -D warnings || cargo clippy --locked || true

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release

      - name: Smoke test binary
        run: |
          ./target/release/clashlime --help
          ./target/release/clashlime --version

      - name: Verify PKGBUILD / .SRCINFO
        run: |
          # Regenerate .SRCINFO and ensure it matches committed file
          if command -v makepkg >/dev/null 2>&1; then
            makepkg --printsrcinfo > /tmp/.SRCINFO.new
            diff -u .SRCINFO /tmp/.SRCINFO.new || {
              echo "::warning::.SRCINFO is out of date. Run 'makepkg --printsrcinfo > .SRCINFO' and commit."
              # Do not fail the release, just warn - PKGBUILD is source of truth for AUR
            }
          else
            echo "makepkg not available on runner, skipping .SRCINFO check"
          fi

      - name: Create release archives
        run: |
          set -euo pipefail
          TAG="${{ steps.tag.outputs.tag }}"
          VERSION="${{ steps.tag.outputs.version }}"
          DIST="clashlime-${TAG}-x86_64-unknown-linux-gnu"
          STAGING="dist/${DIST}"
          mkdir -p "${STAGING}"

          cp target/release/clashlime "${STAGING}/"
          strip "${STAGING}/clashlime" || true

          # Include ancillary files for a self-contained archive
          cp LICENSE "${STAGING}/" 2>/dev/null || true
          cp -r systemd "${STAGING}/" 2>/dev/null || true
          cp -r themes "${STAGING}/" 2>/dev/null || true
          cp -r integrations "${STAGING}/" 2>/dev/null || true
          cp README.md "${STAGING}/" 2>/dev/null || true

          # Create tarball
          tar -C dist -czf "dist/${DIST}.tar.gz" "${DIST}"
          # Standalone binary + checksum
          # NOTE: must not collide with the staging dir name (${DIST})
          cp "${STAGING}/clashlime" "dist/clashlime-${TAG}-linux-x86_64"
          (cd dist && sha256sum "${DIST}.tar.gz" "clashlime-${TAG}-linux-x86_64" > SHA256SUMS)
          cat dist/SHA256SUMS
          ls -lh dist/

      - name: Setup Node for changelogithub
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Generate changelog and create GitHub Release
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/clashlime-*-linux-x86_64
            dist/SHA256SUMS
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
