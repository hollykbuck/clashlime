name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.1.4). Leave empty to use current ref.'
        required: false
        type: string

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve tag
        id: tag
        run: |
          set -euo pipefail
          INPUT_TAG="${{ inputs.tag }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "$INPUT_TAG" ]]; then
            TAG="$INPUT_TAG"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            # workflow_dispatch without input falls back to current SHA tag handling
            if [[ "$TAG" == "$GITHUB_REF" ]]; then
              TAG="$(git describe --tags --exact-match 2>/dev/null || echo "v0.0.0-manual")"
            fi
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION"

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            bin_suffix: linux-x86_64
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
            bin_suffix: linux-aarch64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Verify formatting / lint (non-blocking)
        run: cargo clippy --locked -- -D warnings || cargo clippy --locked || true

      - name: Run tests
        run: cargo test --locked

      - name: Build release binary
        run: cargo build --locked --release

      - name: Smoke test binary
        run: |
          ./target/release/clashlime --help
          ./target/release/clashlime --version

      - name: Create release archives
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          DIST="clashlime-${TAG}-${{ matrix.target }}"
          STAGING="dist/${DIST}"
          mkdir -p "${STAGING}"

          cp target/release/clashlime "${STAGING}/"
          strip "${STAGING}/clashlime" || true

          # Include ancillary files for a self-contained archive
          cp LICENSE "${STAGING}/" 2>/dev/null || true
          cp -r systemd "${STAGING}/" 2>/dev/null || true
          cp -r themes "${STAGING}/" 2>/dev/null || true
          cp -r integrations "${STAGING}/" 2>/dev/null || true
          cp README.md "${STAGING}/" 2>/dev/null || true

          # Create tarball
          tar -C dist -czf "dist/${DIST}.tar.gz" "${DIST}"
          # Standalone binary
          cp "${STAGING}/clashlime" "dist/clashlime-${TAG}-${{ matrix.bin_suffix }}"
          ls -lh dist/

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: |
            dist/*.tar.gz
            dist/clashlime-*-${{ matrix.bin_suffix }}
          retention-days: 1

  release:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all dist artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Verify PKGBUILD / .SRCINFO
        run: |
          # Regenerate .SRCINFO and ensure it matches committed file
          if command -v makepkg >/dev/null 2>&1; then
            makepkg --printsrcinfo > /tmp/.SRCINFO.new
            diff -u .SRCINFO /tmp/.SRCINFO.new || {
              echo "::warning::.SRCINFO is out of date. Run 'makepkg --printsrcinfo > .SRCINFO' and commit."
              # Do not fail the release, just warn - PKGBUILD is source of truth for AUR
            }
          else
            echo "makepkg not available on runner, skipping .SRCINFO check"
          fi

      - name: Generate checksums
        run: |
          cd dist
          sha256sum clashlime-* > SHA256SUMS
          cat SHA256SUMS
          ls -lh

      - name: Setup Node for changelogithub
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Generate changelog and create GitHub Release
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload assets to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: |
            dist/*.tar.gz
            dist/clashlime-*-linux-*
            dist/SHA256SUMS
          generate_release_notes: false
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
