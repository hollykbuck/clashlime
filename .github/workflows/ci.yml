name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

      - name: Build release
        run: cargo build --locked --release

      - name: Verify .deb packaging (Debian)
        run: |
          bash scripts/build-deb "0.0.0+ci" /tmp/deb-test
          dpkg-deb -c /tmp/deb-test/*.deb

      - name: Verify PKGBUILD dry-run (Arch)
        run: |
          if command -v makepkg >/dev/null 2>&1; then
            bash scripts/dry-run
          else
            echo "makepkg not available, validating PKGBUILD syntax only"
            bash -n PKGBUILD
            makepkg --printsrcinfo > /dev/null || echo "::warning::makepkg --printsrcinfo failed"
          fi
